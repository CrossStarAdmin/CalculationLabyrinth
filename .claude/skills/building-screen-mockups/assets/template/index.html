<!--
  このファイルは 01-title 向けに作った実例をテンプレート化したものです。
  <head>〜<div class="phone"><div class="phone-screen">...</div></div> の骨格（共通クロム）はそのまま使い、
  内側の中身（Player ID / logo / character / bottom-area など）はその画面の設計書に合わせて書き換えてください。
  banner-ad と modal-overlay の書き方・重ね順はどの画面でも同じルールなので基本は変えないでください。
  詳しい理由は SKILL.md を参照。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 タイトル画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">

    <!-- ここから画面固有のコンテンツ（設計書に合わせて書き換える） -->

    <!-- サイレントログイン完了時に表示される -->
    <div class="player-id" id="playerId" hidden>
      Player ID: <span id="playerIdValue">-</span>
    </div>

    <img class="logo" src="../assets/logo.png" alt="計算迷宮 Math Labyrinth ロゴ">
    <img class="character" src="../assets/character.png" alt="キャラクター">

    <!-- ローディング中 と START表示 を切り替える領域 -->
    <div class="bottom-area">
      <div class="loading-block" id="loadingBlock">
        <p class="loading-label">LOADING...</p>
        <div class="loading-bar-frame">
          <div class="loading-bar-fill" id="loadingBarFill"></div>
        </div>
      </div>

      <button class="start-button" id="startButton" hidden>
        <span class="deco">◈</span>
        <span>START</span>
        <span class="deco">◈</span>
      </button>
    </div>

    <!-- ここまで画面固有のコンテンツ -->

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示）。広告があるどの画面でも同じ書き方でOK -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

    <!-- 通信失敗時のエラーモーダル（普段は非表示。広告エリアより上に重ねて画面全体を覆う） -->
    <div class="modal-overlay" id="errorModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">⚠</div>
        <p class="modal-message" id="errorMessage">通信に失敗しました</p>
        <button class="reconnect-button" id="reconnectButton">
          <span class="reload-icon">⟳</span> 再接続
        </button>
      </div>
    </div>

  </div>

</div>

<!-- 押すとエラーモーダルを表示できる確認用ボタン -->
<button class="error-toggle" id="errorToggle">通信エラー時の表示を見る</button>

<script src="script.js"></script>
</body>
</html>
