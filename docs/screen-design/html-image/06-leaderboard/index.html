<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 ランキング画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="screen-scrim"></div>

    <div class="top-bar">
      <button class="back-button" data-nav="スタートメニュー">‹ 戻る</button>
      <span class="top-bar-title">ランキング</span>
      <span class="top-bar-spacer"></span>
    </div>

    <!-- ボード（モード × 難易度 × プレイ形式）の選択 -->
    <div class="board-select">
      <select class="board-field" id="modeSelect"></select>
      <select class="board-field" id="difficultySelect"></select>
      <select class="board-field" id="formatSelect"></select>
    </div>

    <!-- 集計期間 -->
    <div class="tab-row" id="periodTabs"></div>

    <!-- ローカル / グローバル -->
    <div class="tab-row scope" id="scopeTabs"></div>

    <!-- ランキング本体 -->
    <div class="rank-panel">
      <p class="rank-caption" id="rankCaption">-</p>
      <ol class="rank-list" id="rankList"></ol>
    </div>

    <!-- グローバル表示時のみ出す自分の順位 -->
    <div class="my-rank" id="myRank" hidden>
      <span class="rank-position" id="myRankPosition">-</span>
      <span class="rank-name" id="myRankName">-</span>
      <span class="rank-score" id="myRankScore">-</span>
    </div>

    <!-- 画面遷移の代わりに「本来は◯◯へ遷移する」と一時的に知らせる通知 -->
    <div class="nav-toast" id="navToast"></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

  </div>
</div>

<!-- 例外系の表示を確認するためのボタン（実際の操作フローとは独立） -->
<div class="preview-buttons">
  <button class="preview-toggle" id="previewRankError">ランキングが取れないときの表示を見る</button>
</div>

<script src="script.js"></script>
</body>
</html>
