<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 図鑑画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="screen-scrim"></div>

    <div class="top-bar">
      <button class="back-button" data-nav="スタートメニュー">‹ 戻る</button>
      <span class="top-bar-title">図鑑</span>
      <span class="top-bar-spacer"></span>
    </div>

    <!-- 遺物 / ガーディアンの切り替え -->
    <div class="tab-row" id="categoryTabs"></div>

    <p class="collect-count" id="collectCount">-</p>

    <!-- 一覧（出会ったかどうかが分かる形で表示する） -->
    <div class="codex-grid" id="codexGrid"></div>

    <!-- 画面遷移の代わりに「本来は◯◯へ遷移する」と一時的に知らせる通知 -->
    <div class="nav-toast" id="navToast"></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

    <!-- 詳細（一覧の項目をタップすると開く） -->
    <div class="modal-overlay" id="detailModal" hidden>
      <div class="modal-box">
        <div class="modal-icon" id="detailIcon">◈</div>
        <h2 class="modal-title" id="detailName">-</h2>
        <p class="detail-rarity" id="detailRarity">-</p>
        <p class="modal-message" id="detailText">-</p>
        <div class="modal-actions">
          <button class="modal-button primary" id="detailClose">閉じる</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
