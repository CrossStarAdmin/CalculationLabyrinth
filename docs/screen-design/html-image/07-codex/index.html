<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 図鑑画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700;800&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/chrome.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="screen-scrim"></div>

    <div class="top-bar">
      <button class="back-button parchment" data-nav="スタートメニュー"><img class="icon icon-flip" src="../assets/icon/icon-arrow-right.png" alt=""><span>戻る</span></button>
    </div>

    <!-- 本文領域。ここから先は通常のフローで縦に積む -->
    <div class="screen-body">
      <h1 class="screen-title">図鑑</h1>

      <!-- 切り替えと収集数はボードの外に置く -->
      <div class="codex-head">
        <div class="rank-tabs" id="categoryTabs"></div>
        <p class="codex-count" id="codexCount">-</p>
      </div>

      <!-- 一覧（出会ったかどうかが分かる形で表示する） -->
      <div class="codex-card wood">
        <!-- 収集率は割合だけを出す -->
        <div class="collect">
          <div class="collect-head">
            <span class="collect-label">収集率</span>
            <span class="collect-value" id="collectValue">-</span>
          </div>
          <div class="collect-bar"><span class="collect-fill" id="collectFill"></span></div>
        </div>

        <!-- 3列 × 4行の12件が収まり、それ以降はスクロールで見る -->
        <div class="codex-grid" id="codexGrid"></div>
      </div>
    </div>


    <!-- 画面遷移の代わりに「本来は◯◯へ遷移する」と一時的に知らせる通知 -->
    <div class="nav-toast" id="navToast"></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

    <!-- 詳細（一覧の項目をタップすると開く） -->
    <div class="modal-overlay" id="detailModal" hidden>
      <div class="modal-box">
        <img class="detail-art" id="detailArt" src="../assets/character.png" alt="">
        <h2 class="modal-title" id="detailName">-</h2>
        <p class="detail-rarity" id="detailRarity">-</p>
        <p class="modal-message" id="detailText">-</p>
        <div class="modal-actions">
          <button class="modal-button primary" id="detailClose">閉じる</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
