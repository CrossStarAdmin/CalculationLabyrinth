<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 モード / 難易度選択画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="screen-scrim"></div>

    <!-- 上部バー: 戻る・コイン・ジェム -->
    <div class="top-bar">
      <button class="back-button" data-nav="スタートメニュー">‹ 戻る</button>
      <div class="currency-badges">
        <span class="currency-badge"><span class="currency-icon coin">●</span><span id="coinValue">-</span></span>
        <span class="currency-badge"><span class="currency-icon gem">◆</span><span id="gemValue">-</span></span>
      </div>
    </div>

    <h1 class="screen-title" style="top:12%;">モードをえらぶ</h1>

    <!-- モード一覧（タイトル画面で取得済みのマスターデータから表示する） -->
    <div class="mode-list" id="modeList"></div>

    <!-- 選択中モードの詳細と難易度。モードが選ばれるまでは非表示 -->
    <div class="detail-panel" id="detailPanel" hidden>
      <p class="detail-name" id="detailName">-</p>
      <p class="detail-desc" id="detailDesc">-</p>
      <p class="detail-label">難易度</p>
      <div class="difficulty-list" id="difficultyList"></div>
    </div>

    <button class="challenge-button" id="challengeButton" disabled>挑戦する</button>

    <!-- 画面遷移の代わりに「本来は◯◯へ遷移する」と一時的に知らせる通知 -->
    <div class="nav-toast" id="navToast"></div>
    <div class="error-toast" id="errorToast"><span id="errorToastMessage">-</span></div>
    <div class="success-toast" id="successToast"><span id="successToastMessage">-</span></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

    <!-- 解放の確認モーダル（支払いに使う通貨を選んでから購入する） -->
    <div class="modal-overlay" id="unlockModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">🔓</div>
        <h2 class="modal-title" id="unlockTitle">-</h2>
        <p class="modal-message">支払いに使う通貨をえらんでください</p>
        <div class="pay-choice">
          <button class="pay-button selected" data-currency="coin">
            <span class="currency-icon coin">●</span> <span id="unlockCoinPrice">-</span>
          </button>
          <button class="pay-button" data-currency="gem">
            <span class="currency-icon gem">◆</span> <span id="unlockGemPrice">-</span>
          </button>
        </div>
        <div class="modal-actions">
          <button class="modal-button" id="unlockCancel">いいえ</button>
          <button class="modal-button primary" id="unlockConfirm">はい</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 例外系の表示を確認するためのボタン（実際の操作フローとは独立） -->
<div class="preview-buttons">
  <button class="preview-toggle" id="previewBestScoreError">ベストスコアが取れないときの表示を見る</button>
  <button class="preview-toggle" id="previewUnlockError">解放に失敗したときの表示を見る</button>
</div>

<script src="script.js"></script>
</body>
</html>
