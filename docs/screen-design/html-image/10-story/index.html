<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 ストーリー画面</title>
<link rel="stylesheet" href="../common/chrome.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="story-scrim"></div>

    <!-- いま表示しているストーリーの段階 -->
    <p class="chapter-label" id="chapterLabel">-</p>

    <img class="stand-image" src="../assets/character.png" alt="あかね">

    <!-- テキスト送り: どこをタップしても次に進む -->
    <button class="text-window" id="textWindow">
      <span class="speaker-name" id="speakerName">-</span>
      <span class="story-text" id="storyText">-</span>
      <span class="next-mark" id="nextMark">▼</span>
    </button>

    <!-- 最後まで読み終わると出る。押すとストーリー用ゲーム画面へ進む -->
    <button class="go-game-button" id="goGameButton" hidden>ゲームに進む</button>

    <!-- 画面遷移の代わりに「本来は◯◯へ遷移する」と一時的に知らせる通知 -->
    <div class="nav-toast" id="navToast"></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

    <!-- ストーリーの取得に失敗したとき -->
    <div class="modal-overlay" id="errorModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">⚠</div>
        <p class="modal-message">ストーリーを取得できませんでした</p>
        <div class="modal-actions">
          <button class="modal-button danger" data-nav="スタートメニュー">メニューに戻る</button>
          <button class="modal-button primary" id="reconnectButton">⟳ 再接続</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 例外系の表示を確認するためのボタン（実際の操作フローとは独立） -->
<div class="preview-buttons">
  <button class="preview-toggle" id="previewStoryError">ストーリーが取得できないときの表示を見る</button>
</div>

<script src="script.js"></script>
</body>
</html>
