<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 ゲーム画面</title>
<link rel="stylesheet" href="../common/chrome.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="screen-scrim"></div>

    <!-- 上部HUD: ポーズ・フロア・意識・目覚めの鈴 -->
    <div class="top-bar">
      <button class="hud-button" id="pauseButton" aria-label="ポーズ">⏸</button>
      <span class="floor-label" id="floorLabel">-</span>
    </div>

    <!-- スコア・意識・目覚めの鈴 -->
    <div class="score-bar">
      <span class="score-label">SCORE</span>
      <span class="score-value" id="scoreValue">0</span>
      <div class="hud-status">
        <span class="hud-badge" id="consciousnessValue">-</span>
        <span class="hud-badge" id="bellValue">-</span>
      </div>
    </div>

    <!-- 計算モード: ガーディアンが問題を出す -->
    <div class="battle-area" id="battleArea">
      <img class="guardian" src="../assets/character.png" alt="ガーディアン">
      <p class="guardian-name" id="guardianName">-</p>

      <div class="question-box">
        <p class="question-count"><span id="questionCount">-</span><span class="combo-value" id="comboValue">-</span></p>
        <p class="question-text" id="questionText">-</p>
        <!-- ポーズ中は問題を隠す -->
        <p class="question-hidden" id="questionHidden" hidden>- ポーズ中 -</p>
      </div>

      <div class="time-frame">
        <div class="time-fill" id="timeFill"></div>
      </div>

      <div class="choice-grid" id="choiceGrid"></div>
    </div>

    <!-- 遺物選択モード: フロア開始時に3つから1つ選ぶ -->
    <div class="relic-area" id="relicArea" hidden>
      <p class="relic-heading">遺物をえらぶ</p>
      <div class="relic-list" id="relicList"></div>
    </div>

    <!-- 画面遷移の代わりに「本来は◯◯へ遷移する」と一時的に知らせる通知 -->
    <div class="nav-toast" id="navToast"></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad">広告表示エリア（バナー広告・常時表示）</div>

    <!-- 遊び方（画面に遷移したときに表示し、閉じるとゲームが始まる） -->
    <div class="modal-overlay" id="howToModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">📖</div>
        <h2 class="modal-title">あそびかた</h2>
        <div class="how-to-image">遊び方画像</div>
        <p class="modal-message">
          ガーディアンの出す計算問題を制限時間内に解きます。<br>
          まちがえると意識が減り、0になるとあかねは眠ってしまいます。
        </p>
        <div class="modal-actions">
          <button class="modal-button primary" id="howToClose">はじめる</button>
        </div>
      </div>
    </div>

    <!-- ポーズ画面（ポーズ中は制限時間が止まり、問題を隠す） -->
    <div class="modal-overlay" id="pauseModal" hidden>
      <div class="modal-box">
        <h2 class="modal-title">ポーズ</h2>
        <div class="volume-row">
          <span class="volume-label">BGM</span>
          <input type="range" min="0" max="100" id="bgmVolume" class="volume-slider">
        </div>
        <div class="volume-row">
          <span class="volume-label">SE</span>
          <input type="range" min="0" max="100" id="seVolume" class="volume-slider">
        </div>
        <div class="modal-actions">
          <button class="modal-button danger" data-nav="スタートメニュー">メニューに戻る</button>
          <button class="modal-button primary" id="resumeButton">再開する</button>
        </div>
      </div>
    </div>

    <!-- 意識が0になったとき（目覚めの鈴が残っていれば使うか確認する） -->
    <div class="modal-overlay" id="bellModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">🔔</div>
        <h2 class="modal-title">あかねが眠ってしまった</h2>
        <p class="modal-message">目覚めの鈴を使いますか？</p>
        <p class="modal-note">動画広告を見ると、スコアが70%になり意識が2戻ります</p>
        <div class="modal-actions">
          <button class="modal-button" id="bellDecline">使わない</button>
          <button class="modal-button primary" id="bellAccept">鈴を使う</button>
        </div>
      </div>
    </div>

    <!-- リワード広告の再生（視聴が終わると目覚める） -->
    <div class="modal-overlay" id="rewardAdModal" hidden>
      <div class="modal-box">
        <h2 class="modal-title">リワード広告</h2>
        <div class="ad-placeholder">動画広告 再生中…</div>
        <p class="modal-message" id="rewardAdCountdown">-</p>
      </div>
    </div>

    <!-- 通信エラー（ラン開始情報 / ラン結果情報が送れなかったとき） -->
    <div class="modal-overlay" id="errorModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">⚠</div>
        <p class="modal-message" id="errorMessage">-</p>
        <p class="modal-note" id="errorNote" hidden>メニューに戻るとこのランの結果は保存されません</p>
        <div class="modal-actions">
          <button class="modal-button danger" data-nav="スタートメニュー">メニューに戻る</button>
          <button class="modal-button primary" id="reconnectButton">⟳ 再接続</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 例外系の表示を確認するためのボタン（実際の操作フローとは独立） -->
<div class="preview-buttons">
  <button class="preview-toggle" id="previewStartError">ラン開始情報を送れないときの表示を見る</button>
  <button class="preview-toggle" id="previewResultError">ラン結果情報を送れないときの表示を見る</button>
</div>

<script src="script.js"></script>
</body>
</html>
