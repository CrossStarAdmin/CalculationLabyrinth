<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 ショップ画面</title>
<link rel="stylesheet" href="../common/chrome.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="phone-screen" style="background-image:url('../assets/background.png');">
    <div class="screen-scrim"></div>

    <div class="top-bar">
      <button class="back-button" data-nav="スタートメニュー">‹ 戻る</button>
      <div class="currency-badges">
        <span class="currency-badge"><span class="currency-icon coin">●</span><span id="coinValue">-</span></span>
        <span class="currency-badge"><span class="currency-icon gem">◆</span><span id="gemValue">-</span></span>
      </div>
    </div>

    <h1 class="screen-title" style="top:11.5%;">ショップ</h1>

    <!-- 商品一覧（ジェム・広告解除の価格はストアから取得する） -->
    <div class="shop-list">
      <p class="shop-section">遺物パッケージ</p>
      <div id="packageList"></div>

      <p class="shop-section">ジェム</p>
      <div id="gemList"></div>

      <p class="shop-section">広告解除</p>
      <div id="adRemovalList"></div>
    </div>

    <div class="nav-toast" id="navToast"></div>
    <div class="error-toast" id="errorToast"><span id="errorToastMessage">-</span></div>
    <div class="success-toast" id="successToast"><span id="successToastMessage">-</span></div>

    <!-- バナー広告エリア（要件定義 3.4: 画面下部に常時表示） -->
    <div class="banner-ad" id="bannerAd">広告表示エリア（バナー広告・常時表示）</div>

    <!-- 遺物パッケージの購入確認（支払いに使う通貨を選んでから購入する） -->
    <div class="modal-overlay" id="buyModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">🛒</div>
        <h2 class="modal-title" id="buyTitle">-</h2>
        <p class="modal-message">支払いに使う通貨をえらんでください</p>
        <div class="pay-choice">
          <button class="pay-button selected" data-currency="coin"><span class="currency-icon coin">●</span> <span id="buyCoinPrice">-</span></button>
          <button class="pay-button" data-currency="gem"><span class="currency-icon gem">◆</span> <span id="buyGemPrice">-</span></button>
        </div>
        <div class="modal-actions">
          <button class="modal-button" id="buyCancel">いいえ</button>
          <button class="modal-button primary" id="buyConfirm">はい</button>
        </div>
      </div>
    </div>

    <!-- ストアの課金処理（ジェム・広告解除） -->
    <div class="modal-overlay" id="billingModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">💳</div>
        <h2 class="modal-title" id="billingTitle">-</h2>
        <p class="modal-message" id="billingMessage">-</p>
        <div class="modal-actions" id="billingActions">
          <button class="modal-button" id="billingCancel">やめる</button>
          <button class="modal-button primary" id="billingConfirm">購入する</button>
        </div>
      </div>
    </div>

    <!-- エラーモーダル（商品情報の取得失敗・購入失敗・課金失敗・レシート検証失敗） -->
    <div class="modal-overlay" id="errorModal" hidden>
      <div class="modal-box">
        <div class="modal-icon">⚠</div>
        <p class="modal-message" id="errorMessage">-</p>
        <p class="modal-note" id="errorNote" hidden>お手数ですが、ユーザーIDを添えてお問い合わせください</p>
        <div class="modal-actions">
          <button class="modal-button danger" data-nav="スタートメニュー">メニューに戻る</button>
          <button class="modal-button primary" id="reconnectButton">⟳ 再接続</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 例外系の表示を確認するためのもの（実際の操作フローとは独立） -->
<div class="preview-buttons">
  <select class="preview-select" id="previewErrorSelect">
    <option value="catalog">商品を表示できなかったとき</option>
    <option value="purchase">遺物パッケージの購入に失敗したとき</option>
    <option value="billing">課金に失敗したとき</option>
    <option value="receipt">レシートの検証に失敗したとき</option>
  </select>
  <button class="preview-toggle" id="previewErrorButton">この表示を見る</button>
</div>

<script src="script.js"></script>
</body>
</html>
